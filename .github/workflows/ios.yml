name: Build iOS IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version && xcodebuild -version
      - run: flutter pub get
      - name: Build iOS
        run: flutter build ios --simulator --debug --build-name=1.1.0 --build-number=10
      - name: Package IPA
        if: always()
        run: |
          ls -lh build/ios/iphonesimulator/
          mkdir -p Payload
          cp -r build/ios/iphonesimulator/Runner.app Payload/
          zip -qry LanCloud.ipa Payload
          ls -lh LanCloud.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lancloud-ios-ipa
          path: LanCloud.ipa
          retention-days: 30
