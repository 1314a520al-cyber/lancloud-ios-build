name: Build iOS IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version && xcodebuild -version
      - run: flutter pub get
      - name: Build iOS
        env:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_IDENTITY: ""
          EXPANDED_CODE_SIGN_IDENTITY: ""
        run: flutter build ipa --no-codesign --build-name=1.1.0 --build-number=10
      - name: Package IPA
        if: always()
        run: |
          ls -lh build/ios/ipa/
          cp build/ios/ipa/*.ipa LanCloud.ipa
          ls -lh LanCloud.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lancloud-ios-ipa
          path: LanCloud.ipa
          retention-days: 30
